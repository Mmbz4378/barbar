<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>اتصال برقرار نیست · رشن</title>
<style>
/* خودبسنده: این صفحه باید بدون شبکه و بدون هیچ فایل دیگری درست دیده شود. */
@font-face{font-family:"IRANYekanX";src:url("./assets/fonts/IRANYekanX-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IRANYekanX";src:url("./assets/fonts/IRANYekanX-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--bg:#f6f6f4;--surface:#fff;--text:#1c1c1a;--muted:#5c5c57;--border:#e4e4e0;--accent:#176b52;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--surface:#1c1c1a;--text:#ededeb;--muted:#a3a39e;--border:#2e2e2b;--accent:#7dd3b0;--on-accent:#0b2a1f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:400 16px/1.9 "IRANYekanX",Tahoma,system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{width:100%;max-width:420px;padding:32px 24px;border:1px solid var(--border);border-radius:24px;background:var(--surface);text-align:center}
svg{width:56px;height:56px;color:var(--muted)}
h1{font-size:22px;margin:12px 0 4px}
p{margin:0 0 24px;color:var(--muted)}
button{min-height:48px;padding:0 28px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font:700 16px/1 inherit;font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.7"/><path d="M19 12.86a10 10 0 0 0-2-1.52"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
  <h1>اتصال برقرار نیست</h1>
  <p>برای دیدن زمان‌های آزاد، وضعیت صف و ثبت نوبت، دوباره به اینترنت وصل شوید. در حالت آفلاین نوبتی ثبت نمی‌شود.</p>
  <button type="button" onclick="location.reload()">تلاش دوباره</button>
</main>
<script>window.addEventListener('online',function(){location.reload()});</script>
</body>
</html>
