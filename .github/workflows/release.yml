# انتشار نسخهٔ تازه: با push یک تگ مثل v14.3.0
#
#   ۱. فایل VERSION را به 14.3.0 تغییر دهید و بخش «## 14.3.0» را در
#      CHANGELOG.md بنویسید؛ commit و merge کنید.
#   ۲. git tag v14.3.0 && git push origin v14.3.0
#      (یا از GitHub ← Releases ← Draft a new release، با ساخت همین تگ)
#
# این workflow آزمون‌ها را اجرا می‌کند، بستهٔ cPanel را می‌سازد، اگر
# Secret به نام RESHEN_SIGNING_KEY تعریف شده باشد امضایش می‌کند و
# Release را با manifest.json منتشر می‌کند. هاست‌ها از روی همین Release
# خودکار به‌روز می‌شوند (docs/updates.md).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: reshen
          MARIADB_USER: reshen
          MARIADB_PASSWORD: reshen
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring, curl, zip, sodium, gd
          coverage: none

      - name: VERSION must match the tag
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::VERSION ($v) با تگ ($GITHUB_REF_NAME) یکی نیست"
            exit 1
          fi

      - name: PHP lint
        run: find app config routes resources tools public database -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Migrate and run flow tests
        run: |
          cat > .env <<'ENV'
          APP_ENV=testing
          APP_DEBUG=false
          APP_URL=http://127.0.0.1
          APP_KEY=ci-only-key-not-secret-0123456789abcdef
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=reshen
          DB_USERNAME=reshen
          DB_PASSWORD=reshen
          SMS_DRIVER=log
          ENV
          php tools/migrate.php
          php tools/test-flows.php
          rm .env

      - name: Build package
        env:
          RESHEN_SIGNING_KEY: ${{ secrets.RESHEN_SIGNING_KEY }}
        run: php tools/build-release.php --out=dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          pre=""
          case "$v" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/reshen-$v.zip" "dist/reshen-$v.zip.sha256" dist/manifest.json \
            --title "رشن $v" --notes-file dist/notes.md $pre
