# آزمون هر push و Pull Request: سینتکس PHP، کنتراست رنگ‌ها، مهاجرت روی
# دیتابیس خالی و آزمون جریان‌ها (tools/test-flows.php).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: reshen
          MARIADB_USER: reshen
          MARIADB_PASSWORD: reshen
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring, curl, zip, sodium, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP lint
        run: find app config routes resources tools public database -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Colour contrast
        run: node tools/check-contrast.mjs

      - name: Migrate and run flow tests
        run: |
          cat > .env <<'ENV'
          APP_ENV=testing
          APP_DEBUG=false
          APP_URL=http://127.0.0.1
          APP_KEY=ci-only-key-not-secret-0123456789abcdef
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=reshen
          DB_USERNAME=reshen
          DB_PASSWORD=reshen
          SMS_DRIVER=log
          ENV
          php tools/migrate.php
          php tools/test-flows.php
